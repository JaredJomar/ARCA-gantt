  .legend { display: flex; gap: 16px; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #gantt_here { width: auto; height: 650px; margin: 14px 20px 24px; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; }
  .gantt_task_line.task-open { background-color: #1f6feb; border-color: #1f6feb; }
  .gantt_task_line.task-open .gantt_task_progress { background-color: #0d4ea6; }
  .gantt_task_line.task-closed { background-color: #2da44e; border-color: #2da44e; }
  .gantt_task_line.task-closed .gantt_task_progress { background-color: #1d7a38; }
  .gantt_task_line.task-overdue { background-color: #d1242f; border-color: #d1242f; }
  .gantt_task_line.task-overdue .gantt_task_progress { background-color: #9e1b25; }
  .gantt_task_line.task-critical { border: 2px solid #d1242f; }
  .gantt_row.row-critical { font-weight: 600; }
  .baseline-bar { position: absolute; height: 6px; background: #8a94a6; opacity: 0.55; border-radius: 3px; z-index: 0; }
  .gantt_marker.today-marker { background-color: rgba(209,36,47,.12); }

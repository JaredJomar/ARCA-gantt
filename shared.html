<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f6f8fa; color: #24292f; }
  header { background: #0d2136; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; font-size: 13px; opacity: .85; }
  .panel { background: #fff; border-bottom: 1px solid #d0d7de; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .panel input[type="text"], .panel select { padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  .panel label { font-size: 14px; }
  button { padding: 8px 14px; border: 1px solid #1f6feb; background: #1f6feb; color: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button.secondary { background: #fff; color: #24292f; border-color: #d0d7de; }
  button.secondary.active { background: #ddf4ff; border-color: #1f6feb; color: #0969da; }
  .legend { display: flex; gap: 16px; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #gantt_here { width: auto; height: calc(100vh - 240px); min-height: 0; margin: 14px 20px 24px; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; }
  .gantt_task_line.task-open { background-color: #1f6feb; border-color: #1f6feb; }
  .gantt_task_line.task-open .gantt_task_progress { background-color: #0d4ea6; }
  .gantt_task_line.task-closed { background-color: #2da44e; border-color: #2da44e; }
  .gantt_task_line.task-closed .gantt_task_progress { background-color: #1d7a38; }
  .gantt_task_line.task-overdue { background-color: #d1242f; border-color: #d1242f; }
  .gantt_task_line.task-overdue .gantt_task_progress { background-color: #9e1b25; }
  .gantt_task_line.task-critical { border: 2px solid #d1242f; }
  .gantt_row.row-critical { font-weight: 600; }
  .baseline-cell { display: block; height: 6px; margin-top: 21px; background: #8a94a6; opacity: 0.55; border-radius: 3px; }
  .today-cell, .gantt_task_cell.today-cell { background-color: rgba(209,36,47,0.10); box-shadow: inset 2px 0 0 #d1242f; }
  .weekend-cell, .gantt_task_cell.weekend-cell { background-color: rgba(0,0,0,0.04); }
.tabbar { display: flex; gap: 8px; padding: 12px 20px 0; align-items: center; }
.tabbar button.active, .pie-controls button.active { background: #ddf4ff; border-color: #1f6feb; color: #0969da; }
.pie-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 20px 0; }
.pie-wrap { display: flex; gap: 24px; align-items: flex-start; padding: 16px 20px 24px; flex-wrap: wrap; }
.pie-block { flex: 1 1 340px; }
.pie-block h3 { margin: 16px 0 0 20px; font-size: 16px; }
#pieSvg { width: 300px; max-width: 90vw; height: auto; flex: none; }
.pie-legend { font-size: 14px; }
.pie-legend div { margin: 5px 0; }
@media (max-width: 700px) {
  body { overflow-x: hidden; }
  header { padding: 12px 14px; }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; }
  .panel { padding: 10px 14px; }
  .panel input[type="password"] { width: 100%; max-width: 100%; }
  .panel input[type="text"], .panel select { width: 100%; }
  #gantt_here { margin: 10px 8px 16px; }
  #workload { margin: 0 8px 16px; overflow-x: auto; }
  #status { padding: 8px 14px; }
  .tabbar, .pie-controls, .pie-wrap { padding-left: 14px; padding-right: 14px; }
  .pie-wrap { flex-direction: column; gap: 12px; }
}
@media print {
  @page { size: landscape; margin: 10mm; }
  html, body { margin: 0 !important; padding: 0 !important; }
  #ganttTab { margin: 0 !important; padding: 0 !important; }
  header, .panel, #status, #workload, #controls, .tabbar, .pie-wrap, .pie-controls, .legend, #meta, #shareMsg, #routerStatus, #autoRefreshMsg { display: none !important; }
  body { background: #fff !important; }
  #gantt_here { margin: 0 !important; border: none !important; height: auto !important; max-height: none !important; overflow: visible !important; break-before: auto !important; break-inside: auto !important; }
  #gantt_here, #gantt_here * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /* Mostrar todo el contenido: quitar el scroll interno del Gantt */
  #gantt_here .gantt_layout, #gantt_here .gantt_layout_cell, #gantt_here .gantt_grid_data, #gantt_here .gantt_task_bg, #gantt_here .gantt_data_area, #gantt_here .gantt_task_data, #gantt_here .gantt_grid_data_inner, #gantt_here .gantt_task_scale, #gantt_here .gantt_grid_scale { overflow: visible !important; height: auto !important; max-height: none !important; }
  #gantt_here .gantt_ver_scroll, #gantt_here .gantt_hor_scroll, #gantt_here .gantt_scroll { display: none !important; }
}
</style>

      }
    });
  }
  gantt.refreshData();
  fitGanttHeight();
  if (window.__pieOpen && typeof renderPie === "function") renderPie();
}
(function buildAssignees() {
  const sel = document.getElementById("fAssignee");
  const names = {};
  DATA.tasks.forEach(function (t) { t.assignees.forEach(function (l) { names[l] = true; }); });
  Object.keys(names).sort().forEach(function (l) {
    const o = document.createElement("option");
    o.value = l;
    o.textContent = "@" + l;
    sel.appendChild(o);
  });
  const o2 = document.createElement("option");
  o2.value = "Sin asignar";
  o2.textContent = "Sin asignar";
  sel.appendChild(o2);
})();
setScale("Week");
gantt.init("gantt_here");
enableColumnResize();
gantt.attachEvent("onGanttRender", fitGanttHeight);
gantt.attachEvent("onGanttRender", routeLinks);
window.addEventListener("resize", fitGanttHeight);
gantt.parse({ data: DATA.tasks, links: DATA.links });
fitGanttHeight();
routeLinks();
// Re-enrutar al desplazar: DHTMLX renderiza los enlaces del viewport al hacer scroll
// y ese render no siempre dispara onGanttRender.
(function () {
  var holder = document.getElementById("gantt_here");
  if (!holder) return;
  var t = null;
  holder.addEventListener("scroll", function () {
    if (t) clearTimeout(t);
    t = setTimeout(routeLinks, 150);
  }, true);
})();
// Re-enrutar cuando DHTMLX recree los enlaces (scroll, filtros, escala).
// Solo childList (no attributes): los cambios de estilo de routeLinks
// no disparan el observador.
(function () {
  var holder = document.getElementById("gantt_here");
  if (!holder || typeof MutationObserver === "undefined") return;
  var t = null;
  var obs = new MutationObserver(function () {
    if (t) clearTimeout(t);
    t = setTimeout(routeLinks, 100);
  });
  obs.observe(holder, { childList: true, subtree: true });
})();
(function () {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  var min = null, max = null;
  gantt.eachTask(function (t) {
    if (t.start_date && (!min || t.start_date < min)) min = t.start_date;
    if (t.end_date && (!max || t.end_date > max)) max = t.end_date;
  });
  var target = monday;
  if (min && target < min) target = min;
  if (max && target > max) target = max;
  gantt.showDate(target);
})();
updateMeta();
document.querySelectorAll(".viewbtn").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".viewbtn").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    setScale(btn.dataset.mode);
  });
});
document.getElementById("fAssignee").addEventListener("change", applyFilters);
document.getElementById("fStatus").addEventListener("change", applyFilters);
document.getElementById("fSearch").addEventListener("input", applyFilters);
document.getElementById("clearFiltersBtn").addEventListener("click", function () { clearFilters(); applyFilters(); });
if (restoreFilters()) applyFilters();
document.getElementById("criticalBtn").addEventListener("click", function () {
  criticalOn = !criticalOn;
  this.classList.toggle("active", criticalOn);
  gantt.render();
  updateMeta();
});
const sb = document.getElementById("showBaseline");
if (sb) {
  sb.addEventListener("change", function () {
    baselineOn = sb.checked;
    gantt.render();
  });
}
